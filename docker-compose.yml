services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-claims}
      POSTGRES_USER: ${POSTGRES_USER:-claims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claims}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claims} -d ${POSTGRES_DB:-claims}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: bitnami/kafka:3.8
    ports:
      - "${KAFKA_PORT:-19092}:9094"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PORT:-19092}
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12


  claims-service:
    build:
      context: ./backend
      dockerfile: claims-service/Dockerfile
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-claims}?currentSchema=claims
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-claims}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-claims}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-chubb-apac-claims-mvp-secret-key-change-in-cloud}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:14200}
    ports:
      - "${CLAIMS_SERVICE_PORT:-18081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-claims}?currentSchema=notifications
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-claims}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-claims}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-chubb-apac-claims-mvp-secret-key-change-in-cloud}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:14200}
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-18082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        CLAIMS_API_URL: ${CLAIMS_API_PUBLIC_URL:-http://localhost:18081}
        NOTIFICATIONS_API_URL: ${NOTIFICATIONS_API_PUBLIC_URL:-http://localhost:18082}
    ports:
      - "${FRONTEND_PORT:-14200}:80"
    depends_on:
      - claims-service
      - notification-service

volumes:
  postgres_data:
