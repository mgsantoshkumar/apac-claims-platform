<div class="login-shell">
  <div class="login-panel">
    <p class="brand">Chubb APAC Claims</p>
    <h1>Sign in to manage motor and property claims</h1>
    <p class="lede">One workspace for claimants and claims staff across six APAC markets.</p>

    <mat-card>
      <mat-card-content>
        <form (ngSubmit)="submit()">
          <mat-form-field appearance="outline" class="full">
            <mat-label>Username</mat-label>
            <input matInput name="username" [(ngModel)]="username" required />
          </mat-form-field>
          <mat-form-field appearance="outline" class="full">
            <mat-label>Password</mat-label>
            <input matInput type="password" name="password" [(ngModel)]="password" required />
          </mat-form-field>
          <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
            {{ loading() ? 'Signing in…' : 'Sign in' }}
          </button>
          @if (error()) {
            <p class="error">{{ error() }}</p>
          }
        </form>

        <div class="demos">
          <p>Demo users (password: <code>password</code>)</p>
          @for (demo of demos; track demo.user) {
            <button mat-stroked-button type="button" (click)="useDemo(demo.user)">
              {{ demo.user }} · {{ demo.role }}
            </button>
          }
        </div>
      </mat-card-content>
    </mat-card>
  </div>
  <div class="login-visual" aria-hidden="true"></div>
</div>
