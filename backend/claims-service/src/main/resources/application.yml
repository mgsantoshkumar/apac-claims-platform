server:
  port: ${SERVER_PORT:18081}

spring:
  application:
    name: claims-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/claims?currentSchema=claims}
    username: ${SPRING_DATASOURCE_USERNAME:claims}
    password: ${SPRING_DATASOURCE_PASSWORD:claims}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: claims
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:16379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

jwt:
  secret: ${JWT_SECRET:chubb-apac-claims-mvp-secret-key-change-in-cloud}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

cors:
  origins: ${CORS_ORIGINS:http://localhost:14200}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.chubb.apac: INFO
