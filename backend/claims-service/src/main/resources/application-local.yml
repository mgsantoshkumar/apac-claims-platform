# Profile for running without Docker infra (H2 + in-memory stubs via test doubles not required;
# prefer docker compose for full stack. This profile uses H2 when Postgres is unavailable.)
spring:
  datasource:
    url: jdbc:h2:mem:claims;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS claims
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: claims
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
